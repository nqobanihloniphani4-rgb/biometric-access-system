<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biometric Door Terminal Kiosk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%); min-height: 100vh;">
    <nav class="navbar">
        <h2>🚪 Door Entry Terminal</h2>
        <div class="nav-links">
            <a href="index.html" class="active">Live Access Portal</a>
            <a href="admin-login.html">Admin Login</a>
        </div>
    </nav>

    <div class="container" style="max-width: 1000px; margin: 40px auto; padding: 0 20px;">
        
        <!-- LIVE ACCESS EVENT LOG WITH FINGERPRINT PICTURE WATERMARK (FULL WIDTH) -->
        <div class="portal-card" style="position: relative; overflow: hidden; padding: 50px;">
            <!-- Centered Picture Watermark -->
            <div style="
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 300px;
                height: 300px;
                background-image: url('fingerprint.png');
                background-size: contain;
                background-position: center;
                background-repeat: no-repeat;
                opacity: 0.1;
                pointer-events: none;
                z-index: 0;
            "></div>

            <div style="position: relative; z-index: 1;">
                <h2 style="font-size: 2.3em; margin-bottom: 8px;">📋 Live Terminal Feed</h2>
                <p style="font-size: 1.2em; margin-bottom: 30px; opacity: 0.95;">Real-time door authentication status from the ESP32 physical access terminal.</p>
                
                <div id="liveStatusBox" style="padding: 35px; background: #ffffff; border-radius: 10px; text-align: center; border: 3px dashed #cbd5e1; color: #333333;">
                    <p style="font-size: 1.7em; font-weight: bold; color: #333333 !important; margin: 0;" id="statusText">Status: Waiting for Biometric Scan...</p>
                </div>
            </div>
        </div>

    </div>

    <!-- 5-SECOND INDIVIDUAL VERIFICATION POPUP -->
    <div id="kioskOverlay" class="kiosk-popup" style="display: none;">
        <div class="kiosk-popup-content">
            <h2 id="kioskTitle" style="font-size: 1.8em;">ACCESS GRANTED</h2>
            <p style="font-size: 1.4em; font-weight: bold;" id="kioskName">User Name</p>
            <p style="font-size: 1.1em; color: #666;" id="kioskDept">Department / Message</p>
            <p style="font-size: 0.9em; color: #888; margin-top: 20px;">Screen will auto-reset in 5 seconds...</p>
        </div>
    </div>

    <script src="app.js"></script>
<script>
    async function pollLatestLogs() {
        try {
            const response = await fetch('/api/events/latest');
            const logs = await response.json();
            
            if (logs && logs.length > 0) {
                const latest = logs[0];
                const statusText = document.getElementById('statusText');
                
                if (statusText) {
                    // Compare milliseconds directly
                    const logTime = Number(latest.timestamp_ms);
                    const currentTime = Date.now();
                    const ageInSeconds = (currentTime - logTime) / 1000;

                    // Display if scanned within the last 5 seconds
                    if (ageInSeconds >= 0 && ageInSeconds <= 5) {
                        if (latest.event_type === 'DURESS_OPEN') {
                            statusText.innerHTML = `<span style="color: #c0392b;">🚨 DURESS ALERT:<br>${latest.full_name} (${latest.employee_code})</span>`;
                        } else if (latest.event_type === 'EXIT') {
                            statusText.innerHTML = `<span style="color: #e67e22;">🚪 Exit Logged:<br>${latest.full_name} (${latest.employee_code})</span>`;
                        } else if (latest.event_type === 'DENIED_UNKNOWN' || latest.event_type === 'DENIED') {
                            statusText.innerHTML = `<span style="color: #e74c3c;">❌ ACCESS DENIED:<br>Unknown Fingerprint Scanned</span>`;
                        } else {
                            statusText.innerHTML = `<span style="color: #27ae60;">✅ Access Granted:<br>${latest.full_name} (${latest.employee_code})</span>`;
                        }
                    } else {
                        statusText.innerHTML = `Status: Waiting for Biometric Scan...`;
                    }
                }
            }
        } catch (err) {
            console.error('Polling error:', err);
        }
    }

    setInterval(pollLatestLogs, 2000);
</script>
</body>
</html>
